<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Maxi - En Vivo</title>
    <style>
        /* Estilos generales estilo modo oscuro elegante */
        body {
            background-color: #0d0d11;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor tipo tarjeta optimizado para abrir desde TikTok */
        .tarjeta-radio {
            background: linear-gradient(145deg, #16161f, #1f1f2e);
            border: 1px solid #2a2a3a;
            border-radius: 25px;
            padding: 35px 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }

        /* Tu Logotipo Circular */
        .logo-estacion {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff0055; /* Borde color neón estilo TikTok */
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 5px 0;
            letter-spacing: 0.5px;
        }

        /* Tu Frecuencia de Transmisión */
        .info-frecuencia {
            font-size: 1.1rem;
            color: #00f2fe; /* Color cyan destacado */
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitulo {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 0;
            margin-bottom: 30px;
        }

        /* Caja contenedora del reproductor de audio */
        .caja-audio {
            background-color: #09090d;
            border-radius: 15px;
            padding: 15px;
            border: 1px solid #1f1f2e;
        }

        /* Reproductor nativo de HTML5 adaptado al 100% de ancho */
        audio {
            width: 100%;
            outline: none;
        }

        /* Etiqueta de En Vivo */
        .badge-vivo {
            display: inline-block;
            background-color: #ff0055;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-transform: uppercase;
            animation: parpadeo 1.5s infinite;
        }

        @keyframes parpadeo {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="tarjeta-radio">
        
        <!-- ESTADO EN VIVO -->
        <span class="badge-vivo">● EN VIVO DESDE TIKTOK</span>

        <!-- TU LOGO (Pon aquí la dirección de tu imagen) -->
        <img src="logo.png" alt="Radio Maxi Logo" class="logo-estacion">

        <!-- NOMBRE DE LA RADIO -->
        <h1>Radio Maxi</h1>
        
        <!-- TU FRECUENCIA -->
        <div class="info-frecuencia">Frecuencia Digital</div>
        <p class="subtitulo">Alimentado por VirtualDJ & BUTT</p>

        <!-- REPRODUCTOR DIRECTO DE AUDIO (Carga al instante) -->
        <div class="caja-audio">
            <audio controls>
                <!-- URL de transmisión directa de tu Zeno.fm -->
                <source src="https://zeno.fm" type="audio/mpeg">
                Tu navegador no soporta este reproductor de audio.
            </audio>
        </div>

    </div>

</body>
</html>
