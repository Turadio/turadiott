<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TURADIO - En Vivo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Degradado moderno de alto impacto en tendencia */
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 40%, #2c5364 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Elemento decorativo sutil para romper el fondo plano */
        body::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(44, 83, 100, 0.4) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* Contenedor flotante estilo Glassmorphism (efecto cristal) */
        .player-container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.07);
            padding: 45px 30px;
            border-radius: 28px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 380px;
        }

        /* Animación del Logotipo */
        .logo-placeholder {
            width: 150px;
            height: 150px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 3s infinite ease-in-out;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(44, 83, 100, 0.6)); }
            50% { transform: scale(1.04); filter: drop-shadow(0 0 25px rgba(0, 212, 255, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(44, 83, 100, 0.6)); }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 13px;
            color: #a5d6a7; /* Color verde claro pastel */
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* CONTENEDOR VISUAL PARA MOSTRAR LA CANCIÓN */
        .metadata-container {
            margin-bottom: 25px;
            background: rgba(0, 0, 0, 0.25);
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .metadata-label {
            font-size: 10px;
            text-transform: uppercase;
            color: #00d4ff;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
            font-weight: bold;
        }
        
        /* EFECTO DE TEXTO EN MOVIMIENTO (MARQUESINA) SI EL TÍTULO ES LARGO */
        .marquee-box {
            overflow: hidden;
            position: relative;
            width: 100%;
            height: 20px;
        }
        #now-playing {
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
            position: absolute;
            width: 100%;
            white-space: nowrap;
            animation: marquee 12s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* DISEÑO PREMIUM: BOTÓN CIRCULAR DE CONTROL PLAY/PAUSA */
        .play-btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }
        .play-button {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #00d4ff 0%, #0072ff 100%);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
            transition: all 0.3s ease;
            outline: none;
        }
        .play-button:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.6);
        }
        .play-button:active {
            transform: scale(0.95);
        }
        /* Icono de Play usando formas CSS nativas */
        .icon-play {
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid white;
            margin-left: 6px;
        }
        /* Icono de Pausa usando formas CSS nativas */
        .icon-pause {
            display: none;
            width: 16px;
            height: 22px;
            justify-content: space-between;
        }
        .icon-pause::before, .icon-pause::after {
            content: "";
            width: 5px;
            height: 100%;
            background-color: white;
            border-radius: 2px;
        }

        /* Ocultación técnica completa del elemento de audio del navegador */
        audio {
            display: none;
        }

        .footer-text {
            margin-top: 35px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        @media (max-width: 320px) {
            .player-container { padding: 30px 20px; }
            .logo-placeholder { width: 120px; height: 120px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <!-- REPRODUCTOR CON LA URL FIJA PARA EVITAR BLOQUEOS DE NAVEGADOR -->
    <audio id="radio-stream" preload="none" crossorigin="anonymous">
        <source src="https://stream.zeno.fm/kns3mkxb6ehvv" type="audio/mpeg">
    </audio>

    <div class="player-container">
        <!-- Contenedor de tu logotipo enlazado -->
        <div class="logo-placeholder">
            <img src="turadiocoveroriginaldos.jpg" alt="Logo TURADIO">
        </div>
        
        <h1>TURADIO</h1>
        <div class="subtitle">Caracas · Venezuela</div>
        
        <!-- TU CAJA DE CANCIÓN LIMPIA DE MARCAS -->
        <div class="metadata-container">
            <div class="metadata-label">🎵 Sonando ahora</div>
            <div class="marquee-box">
                <div id="now-playing">TURADIO - En Vivo</div>
            </div>
        </div>
        
        <!-- INTERFAZ PREMIUM DEL BOTÓN CIRCULAR PERSONALIZADO -->
        <div class="play-btn-container">
            <button class="play-button" id="btn-control-play" aria-label="Reproducir">
                <div class="icon-play" id="icon-p"></div>
                <div class="icon-pause" id="icon-s"></div>
            </button>
        </div>

        <div class="footer-text">Música sin fronteras</div>
    </div>

    <!-- SCRIPT ULTRACOMPACTO PARA EVITAR CORTES DE LONGITUD -->
    <script>
        const mount = 'kns3mkxb6ehvv';
        const txtNode = document.getElementById('now-playing');
        const p = document.getElementById('radio-stream');
        const btn = document.getElementById('btn-control-play');
        const iP = document.getElementById('icon-p');
        const iS = document.getElementById('icon-s');

        btn.addEventListener('click', () => {
            if (p.paused) {
                p.load(); // Fuerza al navegador a leer la URL fija sin bloqueos
                p.play().then(() => {
                    iP.style.display = 'none'; iS.style.display = 'flex';
                }).catch(e => console.error(e));
            } else {
                p.pause();
                iP.style.display = 'block'; iS.style.display = 'none';
            }
        });

        function updateMeta() {
            fetch(`https://zeno.fm{mount}`)
                .then(r => r.json())
                .then(res => {
                    let s = (res && res.data) ? res.data.streamTitle : (res ? res.streamTitle : '');
                    if (s) txtNode.innerText = s;
                }).catch(() => {});
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateMeta();
            setInterval(updateMeta, 10000);
        });
    </script>
</body>
</html>
