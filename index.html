<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TURADIO - En Vivo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 40%, #2c5364 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(44, 83, 100, 0.4) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        .player-container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.07);
            padding: 45px 30px;
            border-radius: 28px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 380px;
        }

        .logo-placeholder {
            width: 150px;
            height: 150px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 3s infinite ease-in-out;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(44, 83, 100, 0.6)); }
            50% { transform: scale(1.04); filter: drop-shadow(0 0 25px rgba(0, 212, 255, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(44, 83, 100, 0.6)); }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 13px;
            color: #a5d6a7;
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        audio {
            width: 100%;
            outline: none;
        }

        /* === NUEVO: Estilos para "Sonando ahora" === */
        .now-playing {
            margin-top: 25px;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
        }

        .now-playing-label {
            font-size: 10px;
            color: #00d4ff;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Puntito pulsante estilo "EN VIVO" */
        .live-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #ff3b3b;
            border-radius: 50%;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }

        .song-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
            margin-bottom: 3px;
            word-break: break-word;
        }

        .song-artist {
            font-size: 13px;
            color: #a5d6a7;
            font-weight: 500;
            word-break: break-word;
        }

        .footer-text {
            margin-top: 35px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        @media (max-width: 320px) {
            .player-container { padding: 30px 20px; }
            .logo-placeholder { width: 120px; height: 120px; }
            h1 { font-size: 24px; }
            .song-title { font-size: 14px; }
            .song-artist { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="logo-placeholder">
            <img src="turadiocoveroriginaldos.jpg" alt="Logo TURADIO">
        </div>

        <h1>TURADIO</h1>
        <div class="subtitle">Música sin interrupciones</div>

        <audio controls autoplay>
            <source src="https://stream.zeno.fm/kns3mkxb6ehvv" type="audio/mpeg">
            Tu dispositivo no soporta este reproductor de audio.
        </audio>

        <!-- === NUEVO: Bloque "Sonando ahora" === -->
        <div class="now-playing">
            <div class="now-playing-label">
                <span class="live-dot"></span> Sonando ahora
            </div>
            <div class="song-title" id="song-title">Cargando...</div>
            <div class="song-artist" id="song-artist"></div>
        </div>

        <div class="footer-text">Música sin fronteras</div>
    </div>

    <!-- === NUEVO: Script que conecta con la API de Zeno.fm === -->
    <script>
        (function() {
            // Tu mount point de Zeno.fm (extraído de tu URL de streaming)
            const MOUNT = 'kns3mkxb6ehvv';
            const API_URL = 'https://api.zeno.fm/mounts/metadata/subscribe/' + MOUNT;

            const titleEl = document.getElementById('song-title');
            const artistEl = document.getElementById('song-artist');

            // Si el navegador no soporta SSE (muy raro hoy en día), salimos
            if (typeof EventSource === 'undefined') {
                titleEl.textContent = 'TURADIO';
                artistEl.textContent = 'Música sin fronteras';
                return;
            }

            const eventSource = new EventSource(API_URL);

            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);

                    // La API de Zeno devuelve la info dentro de "streamTitle"
                    // con el formato "Artista - Título"
                    const streamTitle = data.streamTitle || data.title || '';

                    if (streamTitle && streamTitle.trim() !== '') {
                        const partes = streamTitle.split(' - ');

                        if (partes.length >= 2) {
                            // Formato "Artista - Título"
                            const artista = partes[0].trim();
                            const titulo = partes.slice(1).join(' - ').trim();
                            artistEl.textContent = artista;
                            titleEl.textContent = titulo;
                        } else {
                            // Solo viene un texto, lo mostramos como título
                            titleEl.textContent = streamTitle.trim();
                            artistEl.textContent = 'TURADIO';
                        }
                    } else {
                        titleEl.textContent = 'TURADIO';
                        artistEl.textContent = 'Música sin interrupciones';
                    }
                } catch (e) {
                    console.warn('Error al leer metadatos:', e);
                }
            };

            eventSource.onerror = function() {
                // Si hay error, dejamos un texto por defecto.
                // El navegador intentará reconectar automáticamente.
                titleEl.textContent = 'TURADIO';
                artistEl.textContent = 'Música sin fronteras';
            };
        })();
    </script>

</body>
</html>
