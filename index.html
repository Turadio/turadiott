<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TURADIO - En Vivo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Degradado moderno de alto impacto en tendencia */
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 40%, #2c5364 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Elemento decorativo sutil para romper el fondo plano */
        body::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(44, 83, 100, 0.4) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        /* Contenedor flotante estilo Glassmorphism (efecto cristal) */
        .player-container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.07);
            padding: 45px 30px;
            border-radius: 28px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 380px;
        }

        /* Animación del Logotipo */
        .logo-placeholder {
            width: 150px;
            height: 150px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 3s infinite ease-in-out;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(44, 83, 100, 0.6)); }
            50% { transform: scale(1.04); filter: drop-shadow(0 0 25px rgba(0, 212, 255, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(44, 83, 100, 0.6)); }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 13px;
            color: #a5d6a7; /* Color verde claro pastel */
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Contenedor adaptativo estilizado para el Iframe Oficial de Zeno */
        .zeno-widget-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 18px;
            padding: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            margin-top: 10px;
        }

        .zeno-widget-box iframe {
            border-radius: 12px;
            display: block;
        }

        .footer-text {
            margin-top: 35px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        @media (max-width: 320px) {
            .player-container { padding: 30px 20px; }
            .logo-placeholder { width: 120px; height: 120px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Contenedor de tu logotipo enlazado -->
        <div class="logo-placeholder">
            <img src="turadiocoveroriginaldos.jpg" alt="Logo TURADIO">
        </div>
        
        <h1>TURADIO</h1>
        <div class="subtitle">Caracas · Venezuela</div>
        
        <!-- REPRODUCTOR OFICIAL INCRUSTADO (Muestra títulos y reproduce música sin bloqueos en TikTok/Brave) -->
        <div class="zeno-widget-box">
            <iframe src="https://stream.zeno.fm/kns3mkxb6ehvv" width="100%" height="250" frameborder="0" scrolling="no"></iframe>
        </div>

        <div class="footer-text">Música sin fronteras</div>
    </div>

</body>
</html>
