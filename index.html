<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURADIO - Now Playing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Sin scroll */
            background: transparent; /* Fondo transparente para TikTok */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        /* Carátula cuadrada */
        .cover-container {
            width: 70%;              /* Ajusta este % para agrandar/reducir */
            max-width: 320px;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            background-color: rgba(0, 0, 0, 0.3);
        }

        .cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease-in-out;
            opacity: 0;
            display: block;
        }

        .cover-container img.loaded {
            opacity: 1;
        }

        /* Título y artista */
        .info {
            margin-top: 14px;
            text-align: center;
            width: 90%;
            max-width: 320px;
        }

        .song-title {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.25;
            margin-bottom: 4px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            word-break: break-word;
        }

        .song-artist {
            font-size: 14px;
            font-weight: 500;
            color: #a5d6a7;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="cover-container">
            <img id="album-art" src="turadiocoveroriginaldos.jpg" alt="Cover">
        </div>
        <div class="info">
            <div class="song-title" id="song-title">Cargando...</div>
            <div class="song-artist" id="song-artist"></div>
        </div>
    </div>

    <script>
        (function() {
            const MOUNT = 'kns3mkxb6ehvv';
            const ZENO_API_URL = 'https://api.zeno.fm/mounts/metadata/subscribe/' + MOUNT;
            const DEFAULT_ALBUM_ART = 'turadiocoveroriginaldos.jpg';

            const titleEl = document.getElementById('song-title');
            const artistEl = document.getElementById('song-artist');
            const albumArtEl = document.getElementById('album-art');

            let lastSearchedQuery = '';

            // --- Buscar carátula en iTunes ---
            async function fetchAlbumArt(artist, title) {
                const query = `${artist} ${title}`.trim();
                if (query === lastSearchedQuery) return;
                lastSearchedQuery = query;

                try {
                    const url = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();

                    if (data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
                        let artworkUrl = data.results[0].artworkUrl100.replace('100x100bb.jpg', '600x600bb.jpg');
                        updateAlbumArt(artworkUrl);
                    } else {
                        updateAlbumArt(DEFAULT_ALBUM_ART);
                    }
                } catch (error) {
                    console.error('Error iTunes:', error);
                    updateAlbumArt(DEFAULT_ALBUM_ART);
                }
            }

            // --- Actualizar imagen con fundido ---
            function updateAlbumArt(src) {
                const newImg = new Image();
                newImg.src = src;
                newImg.onload = () => {
                    albumArtEl.src = src;
                    albumArtEl.classList.add('loaded');
                };
                newImg.onerror = () => {
                    albumArtEl.src = DEFAULT_ALBUM_ART;
                    albumArtEl.classList.add('loaded');
                };
            }

            // --- Conexión SSE con Zeno ---
            if (typeof EventSource === 'undefined') {
                titleEl.textContent = 'TURADIO';
                artistEl.textContent = 'Música sin fronteras';
                return;
            }

            const eventSource = new EventSource(ZENO_API_URL);

            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    const streamTitle = data.streamTitle || data.title || '';

                    if (streamTitle && streamTitle.trim() !== '') {
                        const partes = streamTitle.split(' - ');

                        if (partes.length >= 2) {
                            const artista = partes[0].trim();
                            const titulo = partes.slice(1).join(' - ').trim();

                            artistEl.textContent = artista;
                            titleEl.textContent = titulo;
                            fetchAlbumArt(artista, titulo);
                        } else {
                            titleEl.textContent = streamTitle.trim();
                            artistEl.textContent = 'TURADIO';
                        }
                    }
                } catch (e) {
                    console.warn('Error metadatos:', e);
                }
            };

            eventSource.onerror = function() {
                // Silencioso para no molestar en el live
            };
        })();
    </script>

</body>
</html>
