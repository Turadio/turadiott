<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURADIO - Now Playing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-image: url('1787007135377.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0f2027;
        }

        .wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;         /* ← Sube todo hacia el top */
            padding: 20px 5px 5px 5px;           /* ← 20px arriba, 5px lados y abajo */
            gap: 4px;
        }
        
        /* === LOGO DE TURADIO: grande, animado y sin espacio extra === */
        .logo-container {
            height: 150px !important;            /* Altura fija del logo */
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 !important;
            padding: 0 !important;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5));
            animation: logoBreath 4s ease-in-out infinite !important;
            transform-origin: center center;
        }

        .logo-container img {
            height: 100% !important;
            width: auto !important;
            object-fit: contain;
            display: block;
            margin: 0 !important;
            padding: 0 !important;
        }

        @keyframes logoBreath {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.10); }
            100% { transform: scale(1); }
        }

        /* === CARÁTULA === */
        .cover-container {
            width: 68%;
            max-width: 320px;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            background-color: rgba(0, 0, 0, 0.3);
        }

        .cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease-in-out;
            opacity: 0;
            display: block;
        }

        .cover-container img.loaded { opacity: 1; }

        /* === REPRODUCTOR DE AUDIO === */
        .audio-container {
            width: 90%;
            max-width: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        audio {
            width: 100%;
            height: 34px;
            outline: none;
            border-radius: 17px;
            filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(1.1);
            opacity: 0.95;
        }

        /* === TÍTULO Y ARTISTA === */
        .info {
            text-align: center;
            width: 92%;
            max-width: 340px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .song-title {
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.25;
            margin-bottom: 4px;
            word-break: break-word;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }

        .song-artist {
            font-size: 15px;
            font-weight: 600;
            color: #7CFFB2;
            word-break: break-word;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <!-- === LOGO DE TURADIO === -->
        <div class="logo-container">
            <img src="logoturadiocrop.png" alt="Logo TURADIO">
        </div>

        <!-- === CARÁTULA === -->
        <div class="cover-container">
            <img id="album-art" src="turadiocoveroriginaldos.jpg" alt="Cover">
        </div>

        <!-- === REPRODUCTOR === -->
        <div class="audio-container">
            <audio id="player" controls autoplay>
                <source src="https://stream.zeno.fm/kns3mkxb6ehvv" type="audio/mpeg">
                Tu dispositivo no soporta este reproductor.
            </audio>
        </div>

        <!-- === INFO === -->
        <div class="info">
            <div class="song-title" id="song-title">Cargando...</div>
            <div class="song-artist" id="song-artist"></div>
        </div>
    </div>

    <script>
        (function() {
            // --- Configuración ---
            const MOUNT = 'kns3mkxb6ehvv';
            const ZENO_API_URL = 'https://api.zeno.fm/mounts/metadata/subscribe/' + MOUNT;
            const DEFAULT_ALBUM_ART = 'turadiocoveroriginaldos.jpg';
            const CACHE_PREFIX = 'turadio_art_';

            const titleEl = document.getElementById('song-title');
            const artistEl = document.getElementById('song-artist');
            const albumArtEl = document.getElementById('album-art');
            const playerEl = document.getElementById('player');

            let lastSearchedQuery = '';

            // --- Reproducción automática con fallback de clic silencioso ---
            function tryPlay() {
                const promise = playerEl.play();
                if (promise !== undefined) {
                    promise.catch(() => {
                        document.body.addEventListener('click', () => playerEl.play(), { once: true });
                    });
                }
            }
            window.addEventListener('load', tryPlay);

            // --- Caché de carátulas con localStorage ---
            function getCachedAlbumArt(query) {
                try { return localStorage.getItem(CACHE_PREFIX + query); } catch (e) { return null; }
            }
            function setCachedAlbumArt(query, url) {
                try { localStorage.setItem(CACHE_PREFIX + query, url); } catch (e) {}
            }

            // --- Limpiar consulta para iTunes ---
            function cleanQuery(artist, title) {
                let cleanTitle = title;
                cleanTitle = cleanTitle.replace(/\s*[\(\[].*?[\)\]]/g, '');
                const stopWords = ['feat\\.', 'ft\\.', 'featuring', 'remix', 'edit', 'version', 'radio'];
                stopWords.forEach(word => {
                    const regex = new RegExp(`\\b${word}\\b`, 'gi');
                    cleanTitle = cleanTitle.replace(regex, '');
                });
                cleanTitle = cleanTitle.replace(/\s+/g, ' ').trim();
                cleanTitle = cleanTitle.replace(/^[\s\-–—]+|[\s\-–—]+$/g, '');
                return `${artist} ${cleanTitle}`.trim();
            }

            // --- Buscar carátula en iTunes (con caché) ---
            async function fetchAlbumArt(artist, title) {
                const query = cleanQuery(artist, title);
                if (query === lastSearchedQuery) return;
                lastSearchedQuery = query;

                const cachedUrl = getCachedAlbumArt(query);
                if (cachedUrl) {
                    console.log(`⚡ Caché: "${query}"`);
                    updateAlbumArt(cachedUrl);
                    return;
                }

                console.log(`🔍 iTunes: "${query}"`);
                try {
                    const url = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();

                    if (data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
                        let artworkUrl = data.results[0].artworkUrl100.replace('100x100bb.jpg', '600x600bb.jpg');
                        setCachedAlbumArt(query, artworkUrl);
                        updateAlbumArt(artworkUrl);
                    } else {
                        updateAlbumArt(DEFAULT_ALBUM_ART);
                    }
                } catch (error) {
                    console.error('Error iTunes:', error);
                    updateAlbumArt(DEFAULT_ALBUM_ART);
                }
            }

            // --- Actualizar imagen con fundido ---
            function updateAlbumArt(src) {
                if (albumArtEl.src === src && albumArtEl.classList.contains('loaded')) return;
                const newImg = new Image();
                newImg.src = src;
                newImg.onload = () => {
                    albumArtEl.src = src;
                    albumArtEl.classList.add('loaded');
                };
                newImg.onerror = () => {
                    albumArtEl.src = DEFAULT_ALBUM_ART;
                    albumArtEl.classList.add('loaded');
                };
            }

            // --- Conexión SSE con Zeno ---
            if (typeof EventSource === 'undefined') {
                titleEl.textContent = 'TURADIO';
                artistEl.textContent = 'Música sin fronteras';
                return;
            }

            const eventSource = new EventSource(ZENO_API_URL);

            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    const streamTitle = data.streamTitle || data.title || '';

                    if (streamTitle && streamTitle.trim() !== '') {
                        const partes = streamTitle.split(' - ');
                        if (partes.length >= 2) {
                            const artista = partes[0].trim();
                            const titulo = partes.slice(1).join(' - ').trim();
                            artistEl.textContent = artista;
                            titleEl.textContent = titulo;
                            fetchAlbumArt(artista, titulo);
                        } else {
                            titleEl.textContent = streamTitle.trim();
                            artistEl.textContent = 'TURADIO';
                        }
                    }
                } catch (e) {
                    console.warn('Error metadatos:', e);
                }
            };

            eventSource.onerror = function() {
                // Silencioso. EventSource reintenta automáticamente.
            };
        })();
    </script>

</body>
</html>
