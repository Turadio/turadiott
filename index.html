<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURADIO - Now Playing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* === FONDO CON LA IMAGEN === */
        body {
            background-image: url('1787007135377.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0f2027;
        }

        .wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            gap: 12px;
        }

        .cover-container {
            width: 68%;
            max-width: 320px;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            background-color: rgba(0, 0, 0, 0.3);
        }

        .cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease-in-out;
            opacity: 0;
            display: block;
        }

        .cover-container img.loaded { opacity: 1; }

        .audio-container {
            width: 90%;
            max-width: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        audio {
            width: 100%;
            height: 34px;
            outline: none;
            border-radius: 17px;
            filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(1.1);
            opacity: 0.95;
        }

        .info {
            text-align: center;
            width: 92%;
            max-width: 340px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .song-title {
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.25;
            margin-bottom: 4px;
            word-break: break-word;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }

        .song-artist {
            font-size: 15px;
            font-weight: 600;
            color: #7CFFB2;
            word-break: break-word;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="cover-container">
            <img id="album-art" src="turadiocoveroriginaldos.jpg" alt="Cover">
        </div>

        <div class="audio-container">
            <audio id="player" controls autoplay>
                <source src="https://stream.zeno.fm/kns3mkxb6ehvv" type="audio/mpeg">
                Tu dispositivo no soporta este reproductor.
            </audio>
        </div>

        <div class="info">
            <div class="song-title" id="song-title">Cargando...</div>
            <div class="song-artist" id="song-artist"></div>
        </div>
    </div>

    <script>
        (function() {
            // --- Configuración ---
            const MOUNT = 'kns3mkxb6ehvv';
            const ZENO_API_URL = 'https://api.zeno.fm/mounts/metadata/subscribe/' + MOUNT;
            const DEFAULT_ALBUM_ART = 'turadiocoveroriginaldos.jpg';
            const CACHE_PREFIX = 'turadio_art_'; // Prefijo para las claves de la caché

            // --- Referencias a elementos del DOM ---
            const titleEl = document.getElementById('song-title');
            const artistEl = document.getElementById('song-artist');
            const albumArtEl = document.getElementById('album-art');
            const playerEl = document.getElementById('player');

            // --- Control de búsquedas duplicadas ---
            let lastSearchedQuery = '';

            // === NUEVO: Función para limpiar la consulta de búsqueda ===
            // Elimina paréntesis, corchetes, feat., remix, etc.
            function cleanQuery(artist, title) {
                let cleanTitle = title;

                // 1. Quitar todo lo que esté entre paréntesis ( ) o corchetes [ ]
                cleanTitle = cleanTitle.replace(/\s*[\(\[].*?[\)\]]/g, '');

                // 2. Quitar palabras comunes que ensucian la búsqueda
                const stopWords = ['feat\\.', 'ft\\.', 'featuring', 'remix', 'edit', 'version', 'radio'];
                stopWords.forEach(word => {
                    const regex = new RegExp(`\\b${word}\\b`, 'gi');
                    cleanTitle = cleanTitle.replace(regex, '');
                });

                // 3. Quitar espacios dobles y limpiar extremos
                cleanTitle = cleanTitle.replace(/\s+/g, ' ').trim();

                // 4. Quitar guiones sueltos al inicio o final
                cleanTitle = cleanTitle.replace(/^[\s\-–—]+|[\s\-–—]+$/g, '');

                return `${artist} ${cleanTitle}`.trim();
            }

            // === NUEVO: Funciones de caché con sessionStorage ===
            function getCachedAlbumArt(query) {
                try {
                    return sessionStorage.getItem(CACHE_PREFIX + query);
                } catch (e) {
                    return null; // Si sessionStorage está deshabilitado, no fallamos
                }
            }

            function setCachedAlbumArt(query, url) {
                try {
                    sessionStorage.setItem(CACHE_PREFIX + query, url);
                } catch (e) {
                    // Si la caché está llena o deshabilitada, ignoramos silenciosamente
                }
            }

            // --- Reproducción automática ---
            function tryPlay() {
                const promise = playerEl.play();
                if (promise !== undefined) {
                    promise.catch(() => {
                        document.body.addEventListener('click', () => playerEl.play(), { once: true });
                    });
                }
            }
            window.addEventListener('load', tryPlay);

            // === FUNCIÓN OPTIMIZADA: Buscar carátula en iTunes ===
            async function fetchAlbumArt(artist, title) {
                // 1. Limpiamos la consulta
                const query = cleanQuery(artist, title);

                // 2. Evitamos búsquedas duplicadas
                if (query === lastSearchedQuery) return;
                lastSearchedQuery = query;

                // 3. Comprobamos la caché PRIMERO
                const cachedUrl = getCachedAlbumArt(query);
                if (cachedUrl) {
                    console.log(`⚡ Caché: "${query}"`);
                    updateAlbumArt(cachedUrl);
                    return;
                }

                // 4. Si no está en caché, consultamos iTunes
                console.log(`🔍 iTunes: "${query}"`);
                try {
                    const url = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();

                    if (data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
                        let artworkUrl = data.results[0].artworkUrl100.replace('100x100bb.jpg', '600x600bb.jpg');
                        
                        // Guardamos en caché para futuras reproducciones
                        setCachedAlbumArt(query, artworkUrl);
                        
                        updateAlbumArt(artworkUrl);
                    } else {
                        console.log(`⚠️ Sin resultados para: "${query}"`);
                        updateAlbumArt(DEFAULT_ALBUM_ART);
                    }
                } catch (error) {
                    console.error('Error iTunes:', error);
                    updateAlbumArt(DEFAULT_ALBUM_ART);
                }
            }

            // --- Actualizar imagen con fundido suave ---
            function updateAlbumArt(src) {
                // Si ya es la misma imagen, no hacemos nada
                if (albumArtEl.src === src && albumArtEl.classList.contains('loaded')) return;

                const newImg = new Image();
                newImg.src = src;
                newImg.onload = () => {
                    albumArtEl.src = src;
                    albumArtEl.classList.add('loaded');
                };
                newImg.onerror = () => {
                    albumArtEl.src = DEFAULT_ALBUM_ART;
                    albumArtEl.classList.add('loaded');
                };
            }

            // --- Conexión SSE con Zeno ---
            if (typeof EventSource === 'undefined') {
                titleEl.textContent = 'TURADIO';
                artistEl.textContent = 'Música sin fronteras';
                return;
            }

            const eventSource = new EventSource(ZENO_API_URL);

            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    const streamTitle = data.streamTitle || data.title || '';

                    if (streamTitle && streamTitle.trim() !== '') {
                        const partes = streamTitle.split(' - ');
                        if (partes.length >= 2) {
                            const artista = partes[0].trim();
                            const titulo = partes.slice(1).join(' - ').trim();
                            artistEl.textContent = artista;
                            titleEl.textContent = titulo;
                            fetchAlbumArt(artista, titulo);
                        } else {
                            titleEl.textContent = streamTitle.trim();
                            artistEl.textContent = 'TURADIO';
                        }
                    }
                } catch (e) {
                    console.warn('Error metadatos:', e);
                }
            };

            eventSource.onerror = function() {};
        })();
    </script>

</body>
</html>
