<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TURADIO - En Vivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 40%, #2c5364 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 20px; text-align: center;
            position: relative; overflow: hidden;
        }

        body::before {
            content: ""; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(44, 83, 100, 0.4) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 1; pointer-events: none;
        }

        .player-container {
            position: relative; z-index: 2;
            background: rgba(255, 255, 255, 0.07);
            padding: 45px 30px; border-radius: 28px;
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%; max-width: 380px;
        }

        /* === NUEVO: Contenedor para la carátula del álbum === */
        .album-art-container {
            width: 100%;
            aspect-ratio: 1 / 1; /* Mantiene la forma cuadrada */
            margin: 0 auto 20px auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background-color: rgba(0,0,0,0.3); /* Fondo por si tarda en cargar */
            position: relative;
        }

        .album-art-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease-in-out;
            opacity: 0; /* Empieza invisible para un fundido suave */
        }

        .album-art-container img.loaded {
            opacity: 1;
        }

        .logo-placeholder {
            width: 150px; height: 150px; margin: 0 auto 25px auto;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            animation: pulse 3s infinite ease-in-out;
        }

        .logo-placeholder img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(44, 83, 100, 0.6)); }
            50% { transform: scale(1.04); filter: drop-shadow(0 0 25px rgba(0, 212, 255, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(44, 83, 100, 0.6)); }
        }

        h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .subtitle { font-size: 13px; color: #a5d6a7; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
        audio { width: 100%; outline: none; }

        .now-playing {
            margin-top: 20px; padding: 15px 20px;
            background: rgba(0, 0, 0, 0.25); border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-height: 70px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: all 0.4s ease;
        }

        .now-playing-label {
            font-size: 10px; color: #00d4ff; text-transform: uppercase;
            letter-spacing: 2.5px; font-weight: 700; margin-bottom: 6px;
            display: flex; align-items: center; gap: 6px;
        }

        .live-dot {
            display: inline-block; width: 7px; height: 7px;
            background: #ff3b3b; border-radius: 50%; animation: blink 1.2s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

        .song-title { font-size: 16px; font-weight: 700; color: #ffffff; line-height: 1.3; margin-bottom: 3px; word-break: break-word; }
        .song-artist { font-size: 13px; color: #a5d6a7; font-weight: 500; word-break: break-word; }
        .footer-text { margin-top: 35px; font-size: 12px; color: rgba(255, 255, 255, 0.4); letter-spacing: 1px; }

        @media (max-width: 320px) {
            .player-container { padding: 30px 20px; }
            .logo-placeholder { width: 120px; height: 120px; }
            h1 { font-size: 24px; }
            .song-title { font-size: 14px; }
            .song-artist { font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Logo de la radio (se mantiene) -->
        <div class="logo-placeholder">
            <img src="turadiocoveroriginaldos.jpg" alt="Logo TURADIO">
        </div>

        <h1>TURADIO</h1>
        <div class="subtitle">Música sin interrupciones</div>

        <!-- === NUEVO: Contenedor para la carátula del álbum === -->
        <div class="album-art-container">
            <!-- Imagen inicial (puede ser tu logo o una imagen por defecto) -->
            <img id="album-art" src="turadiocoveroriginaldos.jpg" alt="Carátula del álbum">
        </div>

        <audio controls autoplay>
            <source src="https://stream.zeno.fm/kns3mkxb6ehvv" type="audio/mpeg">
            Tu dispositivo no soporta este reproductor de audio.
        </audio>

        <div class="now-playing">
            <div class="now-playing-label">
                <span class="live-dot"></span> Sonando ahora
            </div>
            <div class="song-title" id="song-title">Cargando...</div>
            <div class="song-artist" id="song-artist"></div>
        </div>

        <div class="footer-text">Música sin fronteras</div>
    </div>

    <!-- === SCRIPT ACTUALIZADO === -->
    <script>
        (function() {
            // --- Configuración ---
            const MOUNT = 'kns3mkxb6ehvv';
            const ZENO_API_URL = 'https://api.zeno.fm/mounts/metadata/subscribe/' + MOUNT;
            
            // API de StreamAfrica para carátulas
            const STREAMAFRICA_API_URL = 'https://api-v2.streamafrica.net/musicsearch';
            
            // Imagen por defecto si no se encuentra la carátula (puedes usar tu logo)
            const DEFAULT_ALBUM_ART = 'turadiocoveroriginaldos.jpg';

            // --- Referencias a elementos del DOM ---
            const titleEl = document.getElementById('song-title');
            const artistEl = document.getElementById('song-artist');
            const albumArtEl = document.getElementById('album-art');

            // --- Variable para evitar búsquedas duplicadas de la misma canción ---
            let lastSearchedQuery = '';

            // --- Función para buscar la carátula en StreamAfrica ---
            async function fetchAlbumArt(artist, title) {
                // Construimos la consulta: "Artista Título"
                const query = `${artist} ${title}`.trim();
                
                // Si la consulta es la misma que la anterior, no hacemos nada
                if (query === lastSearchedQuery) return;
                lastSearchedQuery = query;

                console.log(`🔍 Buscando carátula para: "${query}"`);

                try {
                    const url = new URL(STREAMAFRICA_API_URL);
                    url.searchParams.append('service', 'deezer');
                    url.searchParams.append('query', query);

                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const data = await response.json();

                    // La API de StreamAfrica devuelve la info dentro de "results"
                    const artworkUrl = data?.results?.artwork;

                    if (artworkUrl) {
                        console.log(`✅ Carátula encontrada: ${artworkUrl}`);
                        updateAlbumArt(artworkUrl);
                    } else {
                        console.log('⚠️ No se encontró carátula para esta canción, usando por defecto.');
                        updateAlbumArt(DEFAULT_ALBUM_ART);
                    }
                } catch (error) {
                    console.error('❌ Error al buscar la carátula:', error);
                    updateAlbumArt(DEFAULT_ALBUM_ART);
                }
            }

            // --- Función para actualizar la imagen de la carátula con un fundido ---
            function updateAlbumArt(src) {
                // Para evitar parpadeos, creamos una nueva imagen y esperamos a que cargue
                const newImg = new Image();
                newImg.src = src;
                
                newImg.onload = () => {
                    albumArtEl.src = src;
                    albumArtEl.classList.add('loaded'); // Fundido de entrada
                };
                
                newImg.onerror = () => {
                    // Si la URL de la carátula falla, cargamos la imagen por defecto
                    if (albumArtEl.src !== DEFAULT_ALBUM_ART) {
                        console.log('Error al cargar la carátula, usando por defecto.');
                        albumArtEl.src = DEFAULT_ALBUM_ART;
                        albumArtEl.classList.add('loaded');
                    }
                };
            }

            // --- Conexión con la API de metadatos de Zeno (SSE) ---
            if (typeof EventSource === 'undefined') {
                console.warn('EventSource no soportado. El título no se actualizará en vivo.');
                titleEl.textContent = 'TURADIO';
                artistEl.textContent = 'Música sin fronteras';
                return;
            }

            const eventSource = new EventSource(ZENO_API_URL);

            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    const streamTitle = data.streamTitle || data.title || '';

                    if (streamTitle && streamTitle.trim() !== '') {
                        const partes = streamTitle.split(' - ');

                        if (partes.length >= 2) {
                            // Formato "Artista - Título"
                            const artista = partes[0].trim();
                            const titulo = partes.slice(1).join(' - ').trim();
                            
                            // Actualizamos el texto en la página
                            artistEl.textContent = artista;
                            titleEl.textContent = titulo;
                            
                            // === NUEVO: Buscamos la carátula con los datos obtenidos ===
                            fetchAlbumArt(artista, titulo);

                        } else {
                            // Solo viene un texto, lo mostramos como título
                            titleEl.textContent = streamTitle.trim();
                            artistEl.textContent = 'TURADIO';
                            // Opcional: podrías intentar buscar solo por el título aquí también
                        }
                    } else {
                        // Si no hay metadatos, mostramos el estado por defecto
                        titleEl.textContent = 'TURADIO';
                        artistEl.textContent = 'Música sin interrupciones';
                        // No actualizamos la carátula para no perder la que está mostrando
                    }
                } catch (e) {
                    console.warn('Error al leer metadatos:', e);
                }
            };

            eventSource.onerror = function() {
                // Si hay error, dejamos un texto por defecto.
                titleEl.textContent = 'TURADIO';
                artistEl.textContent = 'Música sin fronteras';
            };
        })();
    </script>

</body>
</html>
