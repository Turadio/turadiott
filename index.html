<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Esta línea es CRÍTICA: le dice al celular que adapte el diseño al tamaño de su pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TURADIO - En Vivo</title>
    <style>
        /* Reseteo básico para evitar márgenes raros en móviles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Fondo adaptable a todo tipo de pantallas */
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* Contenedor inteligente: se estira en celulares y se frena en computadoras */
        .player-container {
            background: rgba(255, 255, 255, 0.06);
            padding: 40px 30px;
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 380px; /* Tamaño perfecto para que en PC no se vea gigante ni deforme */
            transition: transform 0.3s ease;
        }

        /* Animación del logotipo */
        .logo-placeholder {
            width: 140px;
            height: 140px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border-radius: 50%;
            margin: 0 auto 25px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 0 25px rgba(255, 75, 43, 0.5);
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 75, 43, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 75, 43, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 75, 43, 0.5); }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: #b0bec5;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Reproductor nativo adaptado al ancho del contenedor */
        audio {
            width: 100%;
            outline: none;
        }

        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 1px;
        }

        /* Ajustes específicos para pantallas muy pequeñas (celulares antiguos) */
        @media (max-width: 320px) {
            .player-container {
                padding: 30px 15px;
            }
            .logo-placeholder {
                width: 110px;
                height: 110px;
                font-size: 35px;
            }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="logo-placeholder">🎧</div>
        
        <h1>TURADIO</h1>
        <div class="subtitle">Caracas · Venezuela</div>
        
        <!-- Tu streaming directo de Zeno -->
        <audio controls autoplay>
            <source src="https://stream.zeno.fm/kns3mkxb6ehvv" type="audio/mpeg">
            Tu dispositivo no soporta este reproductor de audio.
        </audio>

        <div class="footer-text">Música sin fronteras</div>
    </div>

</body>
</html>
