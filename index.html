<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Maxi - En Vivo</title>
    <style>
        /* Estilos generales con modo oscuro elegante */
        body {
            background-color: #0d0d11;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor optimizado para la pantalla de TikTok en móviles */
        .tarjeta-radio {
            background: linear-gradient(145deg, #16161f, #1f1f2e);
            border: 1px solid #2a2a3a;
            border-radius: 20px;
            padding: 30px 20px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        /* Logotipo de tu radio */
        .logo-estacion {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff0055; /* Color de acento estilo TikTok */
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.6rem;
            margin: 10px 0 5px 0;
            letter-spacing: 0.5px;
        }

        /* Datos de la frecuencia / Transmisión */
        .info-frecuencia {
            font-size: 1rem;
            color: #00f2fe; /* Color cyan para destacar la frecuencia */
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .subtitulo {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* Contenedor responsivo del reproductor Zeno */
        .reproductor-zeno {
            background-color: #09090d;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .enlace-credito {
            display: block;
            font-size: 0.75em;
            line-height: 12px;
            color: #666;
            text-decoration: none;
            margin-top: 8px;
        }

        .enlace-credito:hover {
            color: #ff0055;
        }
    </style>
</head>
<body>

    <div class="tarjeta-radio">
        
        <!-- LOGO DE LA RADIO: Reemplaza 'logo.png' por la URL o ruta real de tu imagen -->
        <img src="logo.png" alt="Logo Radio Maxi" class="logo-estacion">

        <!-- NOMBRE DE LA EMISORA -->
        <h1>Radio Maxi</h1>
        
        <!-- FRECUENCIA DE TRANSMISIÓN -->
        <div class="info-frecuencia">Frecuencia Digital En Vivo</div>
        <p class="subtitulo">Mezclando en directo con VirtualDJ</p>

        <!-- REPRODUCTOR DE ZENO.FM (CON ANCHO ADAPTATIVO AL 100%) -->
        <div class="reproductor-zeno">
            <iframe src="https://zeno.fm" width="100%" height="250" frameborder="0" scrolling="no"></iframe>
            <a href="https://zeno.fm/" target="_blank" class="enlace-credito">A Zeno.FM Station</a>
        </div>

    </div>

</body>
</html>
