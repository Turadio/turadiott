<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURADIO - Now Playing</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-image: url('1787007135377.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #0f2027;
        }

        .wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
            gap: 12px;
        }

        .cover-container {
            width: 68%;
            max-width: 320px;
            aspect-ratio: 1 / 1;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            background-color: rgba(0, 0, 0, 0.3);
        }

        .cover-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease-in-out;
            opacity: 0;
            display: block;
        }

        .cover-container img.loaded { opacity: 1; }

        .audio-container {
            width: 90%;
            max-width: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        audio {
            width: 100%;
            height: 34px;
            outline: none;
            border-radius: 17px;
            filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(1.1);
            opacity: 0.95;
        }

        .info {
            text-align: center;
            width: 92%;
            max-width: 340px;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }

        .song-title {
            font-size: 19px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.25;
            margin-bottom: 4px;
            word-break: break-word;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }

        .song-artist {
            font-size: 15px;
            font-weight: 600;
            color: #7CFFB2;
            word-break: break-word;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="cover-container">
            <img id="album-art" src="turadiocoveroriginaldos.jpg" alt="Cover">
        </div>

        <div class="audio-container">
            <audio id="player" controls autoplay loop preload="auto">
                <source src="https://sapircast.caster.fm:11467/9pB8J" type="audio/mpeg">
                Tu dispositivo no soporta este reproductor.
            </audio>
        </div>

        <div class="info">
            <div class="song-title" id="song-title">Cargando...</div>
            <div class="song-artist" id="song-artist"></div>
        </div>
    </div>

    <!-- Aviso para activar el sonido. El clic funciona directamente aquí, sin depender del script. -->
    <div id="unmute-notice"
         onclick="
            var p = document.getElementById('player');
            p.muted = false;
            p.volume = 1;
            p.play();
            this.style.display = 'none';
         "
         style="
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            z-index: 9999;
            padding: 20px;
            gap: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            letter-spacing: 1px;
         ">
        <div style="font-size: 64px;">🔊</div>
        <div>Toca la pantalla para activar el sonido</div>
        <div style="font-size: 14px; opacity: 0.7; font-weight: 400;">(solo hace falta una vez)</div>
    </div>

    <script>
        (function() {
            // === Diagnóstico ===
            const T0 = Date.now();
            function log(msg) {
                const elapsed = ((Date.now() - T0) / 1000).toFixed(1).padStart(6, '0');
                console.log(`[${elapsed}s] ${msg}`);
            }

            log('🚀 Página cargada');

            // --- Configuración de Caster.fm ---
            const CASTER_JSON_URL = 'https://sapircast.caster.fm:11467/status-json.xsl';
            const MOUNT_POINT = '/9pB8J';
            const DEFAULT_ALBUM_ART = 'turadiocoveroriginaldos.jpg';
            const CACHE_PREFIX = 'turadio_art_';
            const POLL_INTERVAL = 3000;

            // --- Referencias DOM ---
            const titleEl = document.getElementById('song-title');
            const artistEl = document.getElementById('song-artist');
            const albumArtEl = document.getElementById('album-art');
            const playerEl = document.getElementById('player');
            const unmuteNotice = document.getElementById('unmute-notice');

            let lastStreamTitle = '';

            // --- Diagnóstico del reproductor de audio ---
            playerEl.addEventListener('error', () => {
                const err = playerEl.error;
                if (err) log(`❌ Error audio: code=${err.code} - ${err.message || 'sin mensaje'}`);
            });
            playerEl.addEventListener('playing', () => log('🎵 Audio reproduciéndose'));
            playerEl.addEventListener('waiting', () => log('⏳ Audio esperando...'));
            playerEl.addEventListener('stalled', () => log('⚠️ Audio estancado'));
            playerEl.addEventListener('loadedmetadata', () => log('📻 Metadatos cargados'));
            playerEl.addEventListener('canplay', () => log('✅ Audio listo'));
            playerEl.addEventListener('volumechange', () => log(`🔉 Volumen: ${playerEl.volume}, muted: ${playerEl.muted}`));

            // --- Limpiar consulta para iTunes ---
            function cleanQuery(artist, title) {
                let cleanTitle = title;
                cleanTitle = cleanTitle.replace(/\s*[\(\[].*?[\)\]]/g, '');
                const stopWords = ['feat\\.', 'ft\\.', 'featuring', 'remix', 'edit', 'version', 'radio'];
                stopWords.forEach(word => {
                    const regex = new RegExp(`\\b${word}\\b`, 'gi');
                    cleanTitle = cleanTitle.replace(regex, '');
                });
                cleanTitle = cleanTitle.replace(/\s+/g, ' ').trim();
                cleanTitle = cleanTitle.replace(/^[\s\-–—]+|[\s\-–—]+$/g, '');
                return `${artist} ${cleanTitle}`.trim();
            }

            // --- Caché con localStorage ---
            function getCachedAlbumArt(query) {
                try { return localStorage.getItem(CACHE_PREFIX + query); } catch (e) { return null; }
            }
            function setCachedAlbumArt(query, url) {
                try { localStorage.setItem(CACHE_PREFIX + query, url); } catch (e) {}
            }

            // --- Intentar reproducir silenciado al cargar (permitido por navegadores) ---
            function tryPlay() {
                playerEl.muted = true;
                const promise = playerEl.play();
                if (promise !== undefined) {
                    promise.then(() => {
                        log('▶️ Reproduciendo en modo silenciado');
                    }).catch((err) => {
                        log(`⚠️ Autoplay bloqueado: ${err.message}`);
                    });
                }
            }
            window.addEventListener('load', tryPlay);

            // --- Buscar carátula en iTunes ---
            async function fetchAlbumArt(artist, title) {
                const query = cleanQuery(artist, title);

                const cachedUrl = getCachedAlbumArt(query);
                if (cachedUrl) {
                    log(`⚡ Caché: "${query}"`);
                    updateAlbumArt(cachedUrl);
                    return;
                }

                log(`🔍 iTunes: "${query}"`);
                try {
                    const url = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=1`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();

                    if (data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
                        let artworkUrl = data.results[0].artworkUrl100.replace('100x100bb.jpg', '600x600bb.jpg');
                        setCachedAlbumArt(query, artworkUrl);
                        updateAlbumArt(artworkUrl);
                    } else {
                        log(`⚠️ Sin resultados en iTunes`);
                        updateAlbumArt(DEFAULT_ALBUM_ART);
                    }
                } catch (error) {
                    log(`❌ Error iTunes: ${error.message}`);
                    updateAlbumArt(DEFAULT_ALBUM_ART);
                }
            }

            // --- Actualizar imagen con fundido ---
            function updateAlbumArt(src) {
                if (albumArtEl.src === src && albumArtEl.classList.contains('loaded')) return;
                const newImg = new Image();
                newImg.src = src;
                newImg.onload = () => {
                    albumArtEl.src = src;
                    albumArtEl.classList.add('loaded');
                    log(`✅ Carátula visible`);
                };
                newImg.onerror = () => {
                    albumArtEl.src = DEFAULT_ALBUM_ART;
                    albumArtEl.classList.add('loaded');
                };
            }

            // === Consulta periódica al JSON de Caster.fm ===
            async function checkNowPlaying() {
                try {
                    const res = await fetch(CASTER_JSON_URL + '?t=' + Date.now());
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();

                    let source = data?.icestats?.source;
                    if (Array.isArray(source)) {
                        source = source.find(s => s.listenurl && s.listenurl.includes(MOUNT_POINT)) || source[0];
                    }
                    if (!source) return;

                    let streamTitle = source.x_icy_title || source.title || '';

                    // Limpiar el prefijo de hora "09:05 : "
                    streamTitle = streamTitle.replace(/^\d{1,2}:\d{2}\s*:\s*/, '').trim();

                    if (!streamTitle) return;
                    if (streamTitle === lastStreamTitle) return;
                    lastStreamTitle = streamTitle;

                    log(`📡 Nueva canción: "${streamTitle}"`);

                    const partes = streamTitle.split(' - ');
                    if (partes.length >= 2) {
                        const artista = partes[0].trim();
                        const titulo = partes.slice(1).join(' - ').trim();
                        artistEl.textContent = artista;
                        titleEl.textContent = titulo;
                        fetchAlbumArt(artista, titulo);
                    } else {
                        titleEl.textContent = streamTitle;
                        artistEl.textContent = 'TURADIO';
                    }
                } catch (e) {
                    // Silencioso
                }
            }

            checkNowPlaying();
            setInterval(checkNowPlaying, POLL_INTERVAL);

            log(`📡 Polling cada ${POLL_INTERVAL/1000}s a Caster.fm`);
        })();
    </script>

</body>
</html>
